[package]
name = "esp-template"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
esp32c2 = [
  "esp-backtrace/esp32c2",
  "esp-bootloader-esp-idf/esp32c2",
  "esp-hal/esp32c2",
  "esp-println/esp32c2",
  "esp-rtos/esp32c2",
]
esp32c3 = [
  "esp-backtrace/esp32c3",
  "esp-bootloader-esp-idf/esp32c3",
  "esp-hal/esp32c3",
  "esp-println/esp32c3",
  "esp-rtos/esp32c3",
]
esp32c5 = [
  "esp-backtrace/esp32c5",
  "esp-bootloader-esp-idf/esp32c5",
  "esp-hal/esp32c5",
  "esp-println/esp32c5",
  "esp-rtos/esp32c5",
]
esp32c6 = [
  "esp-backtrace/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-hal/esp32c6",
  "esp-println/esp32c6",
  "esp-rtos/esp32c6",
]
esp32c61 = [
  "esp-backtrace/esp32c61",
  "esp-bootloader-esp-idf/esp32c61",
  "esp-hal/esp32c61",
  "esp-println/esp32c61",
  "esp-rtos/esp32c61",
]
esp32h2 = [
  "esp-backtrace/esp32h2",
  "esp-bootloader-esp-idf/esp32h2",
  "esp-hal/esp32h2",
  "esp-println/esp32h2",
  "esp-rtos/esp32h2",
]
esp32p4 = [
  "esp-backtrace/esp32p4",
  "esp-bootloader-esp-idf/esp32p4",
  "esp-hal/esp32p4",
  "esp-println/esp32p4",
  "esp-rtos/esp32p4",
]
esp32s31 = [
  "esp-backtrace/esp32s31",
  "esp-bootloader-esp-idf/esp32s31",
  "esp-hal/esp32s31",
  "esp-println/esp32s31",
  "esp-rtos/esp32s31",
]

[dependencies]
defmt = "1"
esp-bootloader-esp-idf = "0.6"
static_cell = "2"

[dependencies.embassy-executor]
version = "0.10"
features = ["defmt"]

[dependencies.embassy-time]
version = "0.5"
features = ["defmt-timestamp-uptime-us"]

[dependencies.esp-backtrace]
version = "0.20"
features = ["defmt", "panic-handler"]

[dependencies.esp-hal]
version = "1.2"
features = ["unstable"]

[dependencies.esp-println]
version = "0.18"
features = ["defmt-espflash"]

[dependencies.esp-rtos]
version = "0.4"
features = ["embassy"]

[lints]
clippy.mem_forget = "deny"
rust.unsafe_code = "deny"
